# Запуск всего сайта одной командой: docker compose up -d --build
# Настройки берутся из файла .env (шаблон: .env.example).

services:
  # Бэкенд: принимает заявки с формы, сохраняет их и шлёт в Telegram (бот живёт в этом же контейнере)
  api:
    build: ./backend
    restart: unless-stopped
    logging: &logs
      # Журналы не растут бесконечно: хранятся 3 файла по 10 МБ (в них может попадать IP посетителя, см. политику)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - leads:/data
    expose:
      - "3000"

  # Фронтенд + Caddy: отдаёт сайт, проксирует /api на бэкенд, сам делает HTTPS
  web:
    build:
      context: ./frontend
      args:
        # Для поисковиков: sitemap.xml, canonical, коды подтверждения (см. docs/SEO.md). Сайт нужно пересобрать: docker compose up -d --build
        SITE_URL: ${SITE_URL:-}
        YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
        GOOGLE_VERIFICATION: ${GOOGLE_VERIFICATION:-}
    restart: unless-stopped
    logging: *logs
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  leads: # заявки (leads.jsonl)
  caddy_data: # сертификаты HTTPS
  caddy_config:
